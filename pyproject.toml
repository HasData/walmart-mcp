[project]
name = "hasdata-walmart-mcp"
version = "1.0.0"
description = "MCP server for Walmart through HasData's hosted API. 1,000 free credits every month."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp","walmart","ecommerce","product-data","price-monitoring","model-context-protocol","hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://docs.hasdata.com/apis/walmart/search"
Repository = "https://github.com/HasData/walmart-mcp"

[project.scripts]
hasdata-walmart-mcp = "hasdata_walmart_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_walmart_mcp"]
